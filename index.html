<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kel's Unlocked Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <header class="bg-dark text-white text-center py-3">
    <h1>Kel's Unlocked Games</h1>
    <p>The ultimate destination for free games!</p>
  </header>
  <main class="container my-4">
    <!-- Admin Panel (Visible Only to Admin) -->
    <section id="upload-section" class="admin-only mb-5">
      <h2 class="text-center">Admin Panel</h2>
      <form id="upload-form" class="p-3 border rounded bg-light">
        <div class="mb-3">
          <label for="game-name" class="form-label">Game Name</label>
          <input type="text" id="game-name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="game-files" class="form-label">Upload Game Files</label>
          <input type="file" id="game-files" class="form-control" webkitdirectory directory multiple required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Upload Game</button>
      </form>
    </section>
    <!-- Games List -->
    <section id="games-list">
      <h2 class="text-center">Available Games</h2>
      <ul id="games-container" class="list-group">
        <!-- Games will be dynamically populated here -->
      </ul>
    </section>
  </main>
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Kel's Unlocked Games. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
