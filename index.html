<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kel's Unlocked Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- Hero Section -->
  <header class="bg-primary text-white text-center py-5">
    <div class="container">
      <h1 class="display-3">Kel's Unlocked Games</h1>
      <p class="lead">Your gateway to the best free games. Play, share, and download now!</p>
      <button class="btn btn-light btn-lg mt-3" onclick="scrollToGames()">Explore Games</button>
    </div>
  </header>

  <!-- Games List Section -->
  <section id="games-list" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Available Games</h2>
      <div class="row" id="games-container">
        <!-- Games will be dynamically populated here -->
      </div>
    </div>
  </section>

  <!-- Admin Panel -->
  <section id="upload-section" class="py-5 bg-light admin-only" style="display: none;">
    <div class="container">
      <h2 class="text-center mb-4">Admin Panel</h2>
      <form id="upload-form" class="p-4 border rounded bg-white mx-auto" style="max-width: 500px;">
        <div class="mb-3">
          <label for="game-name" class="form-label">Game Name</label>
          <input type="text" id="game-name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="game-description" class="form-label">Game Description</label>
          <textarea id="game-description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label for="game-folder" class="form-label">Upload Folder</label>
          <input type="file" id="game-folder" class="form-control" webkitdirectory directory required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Upload Game</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <p>&copy; 2025 Kel's Unlocked Games. All rights reserved.</p>
      <button id="admin-login-btn" class="btn btn-sm btn-light">Admin Login</button>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
