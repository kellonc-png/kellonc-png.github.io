<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kel's Unlocked Games</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header>
        <div class="container">
            <div class="logo">
                <a href="#">Kel's Unlocked Games</a>
            </div>
            <nav>
                <ul>
                    <li><a href="#home" class="active">Home</a></li>
                    <li><a href="#games">Games</a></li>
                    <li><a href="#admin" class="btn-primary">Admin</a></li>
                </ul>
            </nav>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>Welcome to Kel's Unlocked Games</h1>
                <p>Your ultimate destination for free, unlocked games. Explore, download, and enjoy!</p>
            </div>
        </div>
    </section>

    <!-- Games Section -->
    <section id="games" class="games">
        <div class="container">
            <h2>Available Games</h2>
            <div id="games-list">
                <!-- Dynamic list of games will be displayed here -->
            </div>
        </div>
    </section>

    <!-- Admin Section -->
    <section id="admin" class="admin">
        <div class="container">
            <h2>Admin Panel</h2>
            <form id="upload-form">
                <label for="game-name">Game Name:</label>
                <input type="text" id="game-name" placeholder="Enter game name" required>
                <label for="game-file">Upload Game (.zip or .rar):</label>
                <input type="file" id="game-file" accept=".zip,.rar" required>
                <button type="submit" class="btn-primary">Upload</button>
            </form>
            <div id="admin-actions">
                <h3>Manage Uploaded Games</h3>
                <ul id="uploaded-games">
                    <!-- List of uploaded games with remove buttons -->
                </ul>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Kel's Unlocked Games. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
